vich_uploader:
    db_driver: orm
    mappings:
        lieu_image:
            uri_prefix: /images/lieux
            upload_destination: '%kernel.project_dir%/public/images/lieux'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        terrain_image:
            uri_prefix: /images/terrains
            upload_destination: '%kernel.project_dir%/public/images/terrains'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
